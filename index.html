<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Elige tu destino: un juego sencillo donde eliges entre el botón rojo o el botón azul para descubrir tu suerte." />
  <title>Elige tu destino</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-card">
    <header class="app-header">
      <h1 class="app-title">Elige tu destino</h1>
      <p id="status-subtitle" class="app-subtitle">
        Selecciona uno de los dos botones para descubrir tu suerte.
      </p>
    </header>

    <section class="choices-grid" aria-label="Opciones de destino">
      <button id="btn-red" type="button" class="choice-btn choice-btn--red">
        <span class="choice-btn-icon" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"></circle>
          </svg>
        </span>
        <span>Botón Rojo</span>
      </button>

      <button id="btn-blue" type="button" class="choice-btn choice-btn--blue">
        <span class="choice-btn-icon" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 3 21 19 3 19"></polygon>
          </svg>
        </span>
        <span>Botón Azul</span>
      </button>
    </section>

    <section id="result-area" class="result-area" aria-live="polite" hidden>
      <div id="result-banner" class="result-banner">
        <p id="result-message" class="result-message"></p>
        <p id="result-detail" class="result-detail"></p>
      </div>

      <button id="btn-reset" type="button" class="reset-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
          <path d="M3 3v5h5"></path>
        </svg>
        <span>Volver a jugar</span>
      </button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
